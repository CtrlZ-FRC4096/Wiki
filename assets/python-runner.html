<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Runner</title>
<style>
  :root {
    --border: #d1d5db;
    --bg: #ffffff;
    --bar-bg: #f3f4f6;
    --out-bg: #1e1e1e;
    --out-fg: #d4d4d4;
    --accent: #2b6cb0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --border: #4b5563;
      --bg: #1f2937;
      --bar-bg: #111827;
      --out-bg: #0d1117;
      --out-fg: #c9d1d9;
    }
    body { color: #e5e7eb; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    background: var(--bar-bg);
    border-bottom: 1px solid var(--border);
  }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 5px 14px;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  #resetbtn { background: transparent; border: 1px solid var(--border); color: inherit; }
  #status { font-size: 12px; opacity: 0.75; }
  textarea {
    flex: 1;
    width: 100%;
    border: none;
    resize: none;
    padding: 10px;
    font-family: ui-monospace, Consolas, "Cascadia Mono", monospace;
    font-size: 13.5px;
    line-height: 1.45;
    tab-size: 4;
    background: var(--bg);
    color: inherit;
    min-height: 90px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  pre {
    margin: 0;
    padding: 10px;
    background: var(--out-bg);
    color: var(--out-fg);
    font-family: ui-monospace, Consolas, "Cascadia Mono", monospace;
    font-size: 12.5px;
    line-height: 1.4;
    overflow: auto;
    min-height: 70px;
    max-height: 45%;
    border-top: 1px solid var(--border);
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>
</head>
<body>
  <div class="bar">
    <button id="run">&#9654; Run</button>
    <button id="resetbtn">Reset code</button>
    <span id="status">Edit the code, then press Run.</span>
  </div>
  <textarea id="code" spellcheck="false" aria-label="Python code editor"></textarea>
  <pre id="out" aria-label="Program output"></pre>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
  const codeEl = document.getElementById("code");
  const outEl = document.getElementById("out");
  const statusEl = document.getElementById("status");
  const runBtn = document.getElementById("run");
  const resetBtn = document.getElementById("resetbtn");

  // Starter code arrives in the URL fragment so tutorial pages can embed
  // <iframe src=".../python-runner.html#<urlencoded code>">
  // or  <iframe src=".../python-runner.html#b64:<base64 of code>">  (robust to #, %, <, etc.)
  function loadStarter() {
    const frag = decodeURIComponent(location.hash.slice(1));
    if (!frag) return 'print("Hello from Team 4096!")';
    if (frag.startsWith("b64:")) {
      try {
        return new TextDecoder().decode(
          Uint8Array.from(atob(frag.slice(4)), (c) => c.charCodeAt(0))
        );
      } catch (e) { /* fall through */ }
    }
    return frag;
  }
  const starter = loadStarter();
  codeEl.value = starter;

  let pyodidePromise = null;
  function loadPython() {
    if (!pyodidePromise) {
      statusEl.textContent = "Loading Python in your browser (first run takes a few seconds)…";
      pyodidePromise = loadPyodide();
      pyodidePromise.then(() => {
        if (statusEl.textContent.startsWith("Loading")) {
          statusEl.textContent = "Python ready. Press Run.";
        }
      });
    }
    return pyodidePromise;
  }

  runBtn.onclick = async () => {
    runBtn.disabled = true;
    statusEl.textContent = pyodidePromise ? "Running…" : statusEl.textContent;
    outEl.textContent = "";
    try {
      const py = await loadPython();
      py.setStdout({ batched: (s) => { outEl.textContent += s + "\n"; } });
      py.setStderr({ batched: (s) => { outEl.textContent += s + "\n"; } });
      await py.runPythonAsync(codeEl.value);
      statusEl.textContent = "Done. Edit the code and Run again.";
    } catch (err) {
      // Show a friendly Python-style traceback
      outEl.textContent += String(err);
      statusEl.textContent = "Error. Fix the code and press Run again.";
    }
    runBtn.disabled = false;
  };

  resetBtn.onclick = () => { codeEl.value = starter; outEl.textContent = ""; };

  // Tab key inserts spaces instead of leaving the editor
  codeEl.addEventListener("keydown", (e) => {
    if (e.key === "Tab") {
      e.preventDefault();
      const start = codeEl.selectionStart;
      codeEl.value = codeEl.value.slice(0, start) + "    " + codeEl.value.slice(codeEl.selectionEnd);
      codeEl.selectionStart = codeEl.selectionEnd = start + 4;
    }
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      runBtn.click();
    }
  });
</script>
</body>
</html>
