#
# The same kind of file as robot/pyproject.toml in Robot-2026.
# "python -m robotpy sync" reads it and installs these packages.
#

[tool.robotpy]

# The newest 2026 release. Robot-2026 pins 2026.2.1.1 (tracking-hub). The
# small difference does not change anything that the practice code uses.
robotpy_version = "2026.2.2"

# The two RobotPy extras that the practice code uses.
components = ["commands2", "phoenix6"]

requires = []

# Settings for "python -m robotpy test". It runs pytest in this folder.
[tool.pytest.ini_options]
addopts = "-q --tb=short"
filterwarnings = [
    # Our robot code builds Phoenix 6 devices with a CAN bus name such as "rio".
    # That still works in 2026. Phoenix warns that it goes away in 2027.
    "ignore:Constructing devices with a CAN bus string:DeprecationWarning",
]
