[pytest]
# "python -m pytest" in this folder runs the exercise checks in checks/.
# The practice robot has its own tests: run "python -m robotpy test" in robot/.
testpaths = checks
# The exercises import wpilibextra from robot/wpilibextra, our team's copy.
pythonpath = . robot
addopts = -q --tb=short
filterwarnings =
    # Our robot code builds Phoenix 6 devices with a CAN bus name such as "rio".
    # That still works in 2026. Phoenix warns that it goes away in 2027.
    ignore:Constructing devices with a CAN bus string:DeprecationWarning
