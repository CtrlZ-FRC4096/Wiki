title: Field geometry with wpimath
library: robotpy
prompt: |
  Write four functions from our robot code. Positions are in meters. Positions in our code are for the blue alliance, and the code flips them for red.

  - **1.1** `hub_distance`: the distance from the robot to the hub. From `drivetrain.get_hub_distance()`: subtract two `Translation2d` objects, then use `.norm()`.
  - **1.2** `flip_translation`: on red (`should_flip` is `True`), the point is `(FIELD_LENGTH - x, FIELD_WIDTH - y)`. On blue, return the point with no change.
  - **1.3** `flip_pose`: flip the translation, and turn the rotation by 180 degrees with `rotateBy(Rotation2d.fromDegrees(180))`.
  - **1.4** `point_in_front`: the field point `distance_inches` in front of the robot. Make the arrow `Translation2d(meters, 0)`, turn it by the heading of the robot, and add it to the position of the robot. From `intake.intake_pose_in_trench()`.
