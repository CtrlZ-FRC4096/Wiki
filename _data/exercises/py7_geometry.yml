setup: |
  from wpimath.geometry import Pose2d, Rotation2d, Translation2d

  def close(a, b, tol=1e-6):
      return abs(a - b) <= tol
tests:
- name: 1.1 the distance from the robot to the hub
  code: |
    got = hub_distance(Pose2d(1.0, 2.0, Rotation2d.fromDegrees(30)), Translation2d(4.0, 6.0))
    assert isinstance(got, float), f"return a float in meters, got {type(got).__name__}"
    assert close(got, 5.0), f"robot at (1, 2), hub at (4, 6): expected 5.0 m, got {got}"
- name: 1.1 the heading does not change the distance
  code: |
    a = hub_distance(Pose2d(0, 0, Rotation2d.fromDegrees(0)), Translation2d(3, 4))
    b = hub_distance(Pose2d(0, 0, Rotation2d.fromDegrees(170)), Translation2d(3, 4))
    assert close(a, b), f"the heading must not change the distance: got {a} and {b}"
- name: 1.2 flip a point to red
  code: |
    got = flip_translation(Translation2d(1.0, 2.0), True)
    assert isinstance(got, Translation2d), f"return a Translation2d, got {type(got).__name__}"
    assert close(got.X(), FIELD_LENGTH - 1.0) and close(got.Y(), FIELD_WIDTH - 2.0), (
        f"(1, 2) flipped should be ({FIELD_LENGTH - 1.0:.2f}, {FIELD_WIDTH - 2.0:.2f}), "
        f"got ({got.X():.2f}, {got.Y():.2f})")
- name: 1.2 no flip on blue
  code: |
    got = flip_translation(Translation2d(1.0, 2.0), False)
    assert close(got.X(), 1.0) and close(got.Y(), 2.0), (
        f"should_flip is False, so (1, 2) must not change. Got ({got.X():.2f}, {got.Y():.2f})")
- name: 1.3 a flipped pose turns its heading
  code: |
    got = flip_pose(Pose2d(1.0, 2.0, Rotation2d.fromDegrees(30)), True)
    assert isinstance(got, Pose2d), f"return a Pose2d, got {type(got).__name__}"
    assert close(got.X(), FIELD_LENGTH - 1.0) and close(got.Y(), FIELD_WIDTH - 2.0), (
        f"the translation must flip too, got ({got.X():.2f}, {got.Y():.2f})")
    heading = got.rotation().degrees()
    assert close(heading, -150.0, 1e-4), (
        f"30 degrees turned by 180 is -150 degrees (rotateBy wraps to -180..180), got {heading:.1f}")
- name: 1.3 no flip on blue
  code: |
    got = flip_pose(Pose2d(1.0, 2.0, Rotation2d.fromDegrees(30)), False)
    assert close(got.X(), 1.0) and close(got.rotation().degrees(), 30.0, 1e-4), (
        "should_flip is False, so the pose must not change")
- name: 1.4 the point in front of the robot
  code: |
    for heading, expected in [(0, (1.254, 2.0)), (90, (1.0, 2.254)), (180, (0.746, 2.0))]:
        got = point_in_front(Pose2d(1.0, 2.0, Rotation2d.fromDegrees(heading)), 10.0)
        assert isinstance(got, Translation2d), f"return a Translation2d, got {type(got).__name__}"
        assert close(got.X(), expected[0], 1e-3) and close(got.Y(), expected[1], 1e-3), (
            f"robot at (1, 2) facing {heading} degrees: 10 in ahead is "
            f"({expected[0]:.3f}, {expected[1]:.3f}), got ({got.X():.3f}, {got.Y():.3f}). "
            "Did you convert inches to meters, and rotate by the heading of the robot?")
hints:
- '1.1: robot_pose.translation() gives the Translation2d of the robot.'
- '1.3: the new pose is Pose2d(flip_translation(pose.translation(), True), pose.rotation().rotateBy(...)).'
- '1.4: 10 inches is inchesToMeters(10), which is 0.254 m. Use .rotateBy(robot_pose.rotation()).'
solution: |
  from wpimath.geometry import Pose2d, Rotation2d, Translation2d
  from wpimath.units import inchesToMeters

  FIELD_LENGTH = 16.54  # meters
  FIELD_WIDTH = 8.07    # meters

  def hub_distance(robot_pose, hub):
      return (robot_pose.translation() - hub).norm()

  def flip_translation(point, should_flip):
      if not should_flip:
          return point
      return Translation2d(FIELD_LENGTH - point.X(), FIELD_WIDTH - point.Y())

  def flip_pose(pose, should_flip):
      if not should_flip:
          return pose
      return Pose2d(
          flip_translation(pose.translation(), True),
          pose.rotation().rotateBy(Rotation2d.fromDegrees(180)),
      )

  def point_in_front(robot_pose, distance_inches):
      forward = Translation2d(inchesToMeters(distance_inches), 0).rotateBy(robot_pose.rotation())
      return robot_pose.translation() + forward
