title: Step a generator until it ends
prompt: |
  Calling a generator function creates a generator object. next(gen) runs its code until the next yield. If the generator ends, next(gen) raises StopIteration.

  Write count_frames(gen). Use while True to keep stepping. In a try block, call next(gen), then add 1 to the count. In except StopIteration, return the count. The failed completion attempt must not increase the count.

  Three yields require three successful next() calls. A fourth attempt reaches the code after the last yield and reports completion. The checks also verify that this final code runs.

  This browser exercise counts yields, not elapsed time. The robot scheduler advances a command generator during its cycles.
starter: |
  def rumble_for_three_frames():
      frame = 0
      print('rumble ON')
      while frame < 3:
          frame += 1
          yield            # wait for next() from the scheduler
      print('rumble OFF')

  def count_frames(gen):
      n = 0
      # step with next(gen) until StopIteration, then return n
      return n
tests:
- name: the rumble runs three frames
  code: "got = count_frames(rumble_for_three_frames())\nassert got == 3, f\"count_frames\
    \ returned {got}. The generator yields 3 times, then returns\" \n"
- name: a generator with no yield runs zero frames
  code: "def empty():\n    return\n    yield\n\ngot = count_frames(empty())\nassert\
    \ got == 0, f\"count_frames(empty()) returned {got}. Expected 0\" \n"
- name: one yield is one frame
  code: "def once():\n    yield\n\ngot = count_frames(once())\nassert got == 1, f\"\
    count_frames(once()) returned {got}. Expected 1\" \n"
- name: The code after the final yield runs
  code: |
    events = []
    def observed():
        events.append("ON")
        for _ in range(3):
            yield
        events.append("OFF")
    frames = count_frames(observed())
    assert frames == 3, "Count successful next() calls."
    assert events == ["ON", "OFF"], "Step once more after the last yield to reach completion."
hints:
- Call next(gen) before n += 1. Increment only when next succeeds.
- The generator ending raises StopIteration. Catch it with try / except, return the
  count.
solution: |
  def rumble_for_three_frames():
      frame = 0
      print('rumble ON')
      while frame < 3:
          frame += 1
          yield
      print('rumble OFF')

  def count_frames(gen):
      n = 0
      try:
          while True:
              next(gen)
              n += 1
      except StopIteration:
          return n
