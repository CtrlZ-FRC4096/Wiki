title: The dashboard, the auto chooser, and match/case
library: robotpy
prompt: |
  **What you need**

  - `SmartDashboard.putNumber(key, value)` puts a number on the dashboard. `SmartDashboard.putBoolean(key, value)` puts a `True`/`False` value.
  - `SmartDashboard.getNumber(key, default)` reads a number. It gives `default` if the key is not on the dashboard.
  - `chooser = wpilib.SendableChooser()` makes a chooser. `chooser.setDefaultOption(name, value)` adds the default option, and `chooser.addOption(name, value)` adds another option. `SmartDashboard.putData(key, chooser)` puts the chooser on the dashboard.
  - `match`/`case` compares one value with each `case`, from the top. `case _:` matches any value:

  ```python
  match value:
      case 1:
          return "one"
      case _:
          return "something else"
  ```

  **The parts**

  - **8.1** `log_shooter(fly_speed, hood_angle, ready)`: put `fly_speed` as `"Shooter/Fly Speed"`, `hood_angle` as `"Shooter/Hood Angle"`, and `ready` as `"Shooter/Ready"`.
  - **8.2** `make_auto_chooser()`: return a chooser that is on the dashboard as `"Auto Chooser"`. The default option is `"Default (no auto)"` with the value 0. The other options are `"Right Trench"` with 5 and `"Left Trench"` with 6. From `robot.py`.
  - **8.3** `pick_auto(choice)`: use `match`/`case`, as in the "Pick the auto" section above. Return `"right_trench"` for 5, `"left_trench"` for 6, and `"no_auto"` for any other value.
  - **8.4** `read_test_fly_speed()`: return the number `"Test/Test fly speed"` from the dashboard, with the default 60.

