  - **8.2** `make_auto_chooser`: make a `wpilib.SendableChooser`. The default option is `"Default (no auto)"` with the value 0. Add `"Right Trench"` (5) and `"Left Trench"` (6). Put it on the dashboard as `"Auto Chooser"`, then return it. From `robot.py`.
