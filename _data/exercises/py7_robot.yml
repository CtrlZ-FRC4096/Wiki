title: Run a whole robot
library: robotpy
prompt: |
  This is a small robot with the same parts as Robot-2026: constants, a subsystem, an OI, and a `Robot` class built on `CoroutineRobot`. The checks start it and run it mode by mode, 50 loops each second, the same way the robot tests in RobotPy do.

  The flags `is_intaking` and `clear_jam` belong to the `Robot`. `robot_start()` makes them. The intake and the OI reach them as `self.robot.is_intaking` and `self.robot.clear_jam`.

  You have the tools from exercises 1, 5, 6 and 7. One more: `WaitCommand(seconds)` is a command that waits.

  - **9.1** `Intake.periodic()`: if `clear_jam` is `True`, run at `JAM_SPEED`. If `is_intaking` is `True`, run at `INTAKE_SPEED`. If neither, stop. `clear_jam` wins.
  - **9.2** In `OI.__init__`: hold the left trigger to intake. Release it to stop. The button is `self.driver1.LEFT_TRIGGER_AS_BUTTON`.
  - **9.3** `Robot.make_auto()`: return an auto that intakes for `AUTO_INTAKE_SECONDS`, then stops. The checks run auto two times, and a command can be in one group only.

starter: |
  from commands2 import CommandScheduler, SequentialCommandGroup, WaitCommand
  from phoenix6 import controls, hardware
  from wpilib import SmartDashboard
  from wpilibextra.coroutine import commandify
  from wpilibextra.coroutine.coroutine_robot import CoroutineRobot
  from wpilibextra.coroutine.subsystem import Subsystem
  from wpilibextra.customcontroller import XboxCommandController

  ### const.py ###
  INTAKE_MOTOR_ID = 25
  INTAKE_SPEED = 85            # percent
  JAM_SPEED = -30              # percent
  AUTO_INTAKE_SECONDS = 2.0

  ### subsystems/intake.py ###
  class Intake(Subsystem):
      def __init__(self, robot):
          super().__init__()
          self.robot = robot
          self.commanded_speed = 0.0
          self.motor = hardware.TalonFX(INTAKE_MOTOR_ID, "rio")

      def set_speed(self, percent):
          self.commanded_speed = percent / 100
          self.motor.set_control(controls.DutyCycleOut(percent / 100))

      def get_speed(self):
          if self.robot.isSimulation():
              return self.commanded_speed
          return self.motor.get_velocity().value

      def stop(self):
          self.commanded_speed = 0.0
          self.motor.set_control(controls.DutyCycleOut(0.0))

      def periodic(self):
          pass  # 9.1

      def log(self):
          SmartDashboard.putNumber("Intake/Commanded Speed", self.commanded_speed)

  ### oi.py ###
  class OI:
      def __init__(self, robot):
          self.robot = robot
          self.driver1 = XboxCommandController(0)

          # Complete example: hold POV LEFT to run the intake backwards.
          @self.driver1.POV.LEFT.whenHeld
          def _():
              self.robot.clear_jam = True

          @self.driver1.POV.LEFT.whenReleased
          def _():
              self.robot.clear_jam = False

          # 9.2 the left trigger

  ### robot.py ###
  class Robot(CoroutineRobot):
      def robot_start(self):
          self.scheduler = CommandScheduler.getInstance()
          self.is_intaking = False
          self.clear_jam = False
          self.intake = Intake(self)   # a Subsystem registers itself
          self.subsystems = [self.intake]
          self.oi = OI(self)

          @self.addPeriodic(period=0.1, offset=0)
          def _():
              for subsystem in self.subsystems:
                  subsystem.log()

          while True:
              yield
              self.scheduler.run()

      def disabled_mode(self):
          self.scheduler.cancelAll()
          # periodic() still runs when disabled, so clear the flags too.
          self.is_intaking = False
          self.clear_jam = False
          for subsystem in self.subsystems:
              subsystem.stop()
          while True:
              yield

      def autonomous_mode(self):
          self.scheduler.cancelAll()
          self.scheduler.schedule(self.make_auto())

      def make_auto(self):
          return SequentialCommandGroup()  # 9.3

      def teleop_mode(self):
          self.scheduler.cancelAll()
          self.is_intaking = False
          self.clear_jam = False
          while True:
              yield
setup: |
  import cz_sim as sim

  def start():
      runner = sim.RobotRunner(Robot)
      pad = sim.Gamepad(0)
      return runner, runner.robot, pad

  def teleop(runner, seconds):
      runner.step_timing(seconds=seconds, autonomous=False, enabled=True)

  def auto(runner, seconds):
      runner.step_timing(seconds=seconds, autonomous=True, enabled=True)
tests:
- name: 9.1 and 9.2 the left trigger runs the intake
  code: |
    runner, robot, pad = start()
    teleop(runner, 0.5)
    assert robot.intake.get_speed() == 0, "the intake must be off at the start of teleop"
    pad.set_axis("LeftTrigger", 1.0)
    teleop(runner, 0.2)
    assert robot.is_intaking, "9.2: holding the left trigger should set robot.is_intaking"
    assert robot.intake.get_speed() == 0.85, (
        f"9.1: is_intaking is True, so the intake should run at 85% (0.85), got {robot.intake.get_speed()}")
    pad.set_axis("LeftTrigger", 0.0)
    teleop(runner, 0.2)
    assert not robot.is_intaking, "9.2: releasing the left trigger should set robot.is_intaking to False"
    assert robot.intake.get_speed() == 0, "9.1: with no flags set, the intake must stop"
- name: 9.1 clear_jam wins
  code: |
    runner, robot, pad = start()
    teleop(runner, 0.5)
    pad.set_axis("LeftTrigger", 1.0)
    pad.set_pov(270)  # POV LEFT
    teleop(runner, 0.2)
    assert robot.intake.get_speed() == -0.30, (
        f"9.1: clear_jam is checked first, so the intake should run at -30% (-0.30), got {robot.intake.get_speed()}")
- name: 9.3 auto intakes, then stops
  code: |
    runner, robot, pad = start()
    auto(runner, 1.0)
    assert robot.intake.get_speed() == 0.85, f"9.3: 1 s into auto the intake should run at 0.85, got {robot.intake.get_speed()}"
    auto(runner, 1.5)
    assert robot.intake.get_speed() == 0, f"9.3: after 2 s of auto the intake should stop, got {robot.intake.get_speed()}"
- name: 9.3 auto works two times
  code: |
    runner, robot, pad = start()
    auto(runner, 2.5)
    runner.step_timing(seconds=0.5, autonomous=True, enabled=False)
    try:
        auto(runner, 1.0)
    except Exception as e:
        raise AssertionError(
            f"9.3: the second auto crashed: {type(e).__name__}. Make new commands inside make_auto() each time")
    assert robot.intake.get_speed() == 0.85, "9.3: the second auto should intake too"
- name: disabled stops everything
  code: |
    runner, robot, pad = start()
    teleop(runner, 0.5)
    pad.set_axis("LeftTrigger", 1.0)
    teleop(runner, 0.2)
    runner.step_timing(seconds=0.2, autonomous=False, enabled=False)
    assert robot.intake.get_speed() == 0, "when the robot is disabled, every subsystem must stop and stay stopped"
hints:
- "9.1: the same shape as periodic() in exercise 1, with self.set_speed(...) and self.stop()."
- "9.2: copy the POV LEFT pair of bindings, with the left trigger as the button and is_intaking as the flag."
- "9.3: inside make_auto(), write two @commandify functions: start_intake sets self.is_intaking = True, and stop_intake sets it to False."
- "9.3: return SequentialCommandGroup(start_intake, WaitCommand(AUTO_INTAKE_SECONDS), stop_intake). The functions are inside make_auto(), so each auto gets new commands."

solution: |
  from commands2 import CommandScheduler, SequentialCommandGroup, WaitCommand
  from phoenix6 import controls, hardware
  from wpilib import SmartDashboard
  from wpilibextra.coroutine import commandify
  from wpilibextra.coroutine.coroutine_robot import CoroutineRobot
  from wpilibextra.coroutine.subsystem import Subsystem
  from wpilibextra.customcontroller import XboxCommandController

  ### const.py ###
  INTAKE_MOTOR_ID = 25
  INTAKE_SPEED = 85            # percent
  JAM_SPEED = -30              # percent
  AUTO_INTAKE_SECONDS = 2.0

  ### subsystems/intake.py ###
  class Intake(Subsystem):
      def __init__(self, robot):
          super().__init__()
          self.robot = robot
          self.commanded_speed = 0.0
          self.motor = hardware.TalonFX(INTAKE_MOTOR_ID, "rio")

      def set_speed(self, percent):
          self.commanded_speed = percent / 100
          self.motor.set_control(controls.DutyCycleOut(percent / 100))

      def get_speed(self):
          if self.robot.isSimulation():
              return self.commanded_speed
          return self.motor.get_velocity().value

      def stop(self):
          self.commanded_speed = 0.0
          self.motor.set_control(controls.DutyCycleOut(0.0))

      def periodic(self):
          if self.robot.clear_jam:
              self.set_speed(JAM_SPEED)
          elif self.robot.is_intaking:
              self.set_speed(INTAKE_SPEED)
          else:
              self.stop()

      def log(self):
          SmartDashboard.putNumber("Intake/Commanded Speed", self.commanded_speed)

  ### oi.py ###
  class OI:
      def __init__(self, robot):
          self.robot = robot
          self.driver1 = XboxCommandController(0)

          @self.driver1.POV.LEFT.whenHeld
          def _():
              self.robot.clear_jam = True

          @self.driver1.POV.LEFT.whenReleased
          def _():
              self.robot.clear_jam = False

          @self.driver1.LEFT_TRIGGER_AS_BUTTON.whenHeld
          def _():
              self.robot.is_intaking = True

          @self.driver1.LEFT_TRIGGER_AS_BUTTON.whenReleased
          def _():
              self.robot.is_intaking = False

  ### robot.py ###
  class Robot(CoroutineRobot):
      def robot_start(self):
          self.scheduler = CommandScheduler.getInstance()
          self.is_intaking = False
          self.clear_jam = False
          self.intake = Intake(self)
          self.subsystems = [self.intake]
          self.oi = OI(self)

          @self.addPeriodic(period=0.1, offset=0)
          def _():
              for subsystem in self.subsystems:
                  subsystem.log()

          while True:
              yield
              self.scheduler.run()

      def disabled_mode(self):
          self.scheduler.cancelAll()
          self.is_intaking = False
          self.clear_jam = False
          for subsystem in self.subsystems:
              subsystem.stop()
          while True:
              yield

      def autonomous_mode(self):
          self.scheduler.cancelAll()
          self.scheduler.schedule(self.make_auto())

      def make_auto(self):
          @commandify
          def start_intake():
              self.is_intaking = True

          @commandify
          def stop_intake():
              self.is_intaking = False

          return SequentialCommandGroup(
              start_intake,
              WaitCommand(AUTO_INTAKE_SECONDS),
              stop_intake,
          )

      def teleop_mode(self):
          self.scheduler.cancelAll()
          self.is_intaking = False
          self.clear_jam = False
          while True:
              yield
