title: Run a whole robot
library: robotpy
prompt: |
  This is a small robot with the same parts as Robot-2026: constants, a subsystem, an OI, and a `Robot` class built on `CoroutineRobot`. The checks start it and run it mode by mode, 50 loops each second, the same way RobotPy's robot tests do.

  - **R.1** `Intake.periodic()`: the first `True` flag wins. `self.robot.clear_jam` runs at `JAM_SPEED`, `self.robot.is_intaking` runs at `INTAKE_SPEED`, and anything else calls `stop()`.
  - **R.2** In `OI`: while the left trigger is held, `self.robot.is_intaking` is `True`. When it is released, it is `False`. Use `LEFT_TRIGGER_AS_BUTTON`.
  - **R.3** `Robot.make_auto()`: intake for `AUTO_INTAKE_SECONDS`, then stop. Make two `@commandify` functions inside `make_auto()`, and return `SequentialCommandGroup(start_intake, WaitCommand(...), stop_intake)`. The checks run auto two times, so the commands must be new each time.
starter: |
  from commands2 import CommandScheduler, SequentialCommandGroup, WaitCommand
  from phoenix6 import controls, hardware
  from wpilib import SmartDashboard
  from wpilibextra.coroutine import commandify
  from wpilibextra.coroutine.coroutine_robot import CoroutineRobot
  from wpilibextra.coroutine.subsystem import Subsystem
  from wpilibextra.customcontroller import XboxCommandController

  ### const.py ###
  INTAKE_MOTOR_ID = 25
  INTAKE_SPEED = 85            # percent
  JAM_SPEED = -30              # percent
  AUTO_INTAKE_SECONDS = 2.0

  ### subsystems/intake.py ###
  class Intake(Subsystem):
      def __init__(self, robot):
          super().__init__()
          self.robot = robot
          self.commanded_speed = 0.0
          self.motor = hardware.TalonFX(INTAKE_MOTOR_ID, "rio")

      def set_speed(self, percent):
          self.commanded_speed = percent / 100
          self.motor.set_control(controls.DutyCycleOut(percent / 100))

      def get_speed(self):
          if self.robot.isSimulation():
              return self.commanded_speed
          return self.motor.get_velocity().value

      def stop(self):
          self.commanded_speed = 0.0
          self.motor.set_control(controls.DutyCycleOut(0.0))

      def periodic(self):
          pass  # R.1

      def log(self):
          SmartDashboard.putNumber("Intake/Commanded Speed", self.commanded_speed)

  ### oi.py ###
  class OI:
      def __init__(self, robot):
          self.robot = robot
          self.driver1 = XboxCommandController(0)

          # Complete example: hold POV LEFT to run the intake backwards.
          @self.driver1.POV.LEFT.whenHeld
          def _():
              self.robot.clear_jam = True

          @self.driver1.POV.LEFT.whenReleased
          def _():
              self.robot.clear_jam = False

          # R.2 the left trigger

  ### robot.py ###
  class Robot(CoroutineRobot):
      def robot_start(self):
          self.scheduler = CommandScheduler.getInstance()
          self.is_intaking = False
          self.clear_jam = False
          self.intake = Intake(self)   # a Subsystem registers itself
          self.subsystems = [self.intake]
          self.oi = OI(self)

          @self.addPeriodic(period=0.1, offset=0)
          def _():
              for subsystem in self.subsystems:
                  subsystem.log()

          while True:
              yield
              self.scheduler.run()

      def disabled_mode(self):
          self.scheduler.cancelAll()
          # periodic() still runs when disabled, so clear the flags too.
          self.is_intaking = False
          self.clear_jam = False
          for subsystem in self.subsystems:
              subsystem.stop()
          while True:
              yield

      def autonomous_mode(self):
          self.scheduler.cancelAll()
          self.scheduler.schedule(self.make_auto())

      def make_auto(self):
          return SequentialCommandGroup()  # R.3

      def teleop_mode(self):
          self.scheduler.cancelAll()
          self.is_intaking = False
          self.clear_jam = False
          while True:
              yield
setup: |
  import cz_sim as sim

  def start():
      runner = sim.RobotRunner(Robot)
      pad = sim.Gamepad(0)
      return runner, runner.robot, pad

  def teleop(runner, seconds):
      runner.step_timing(seconds=seconds, autonomous=False, enabled=True)

  def auto(runner, seconds):
      runner.step_timing(seconds=seconds, autonomous=True, enabled=True)
tests:
- name: R.1 and R.2 the left trigger runs the intake
  code: |
    runner, robot, pad = start()
    teleop(runner, 0.5)
    assert robot.intake.get_speed() == 0, "the intake must be off at the start of teleop"
    pad.set_axis("LeftTrigger", 1.0)
    teleop(runner, 0.2)
    assert robot.is_intaking, "R.2: holding the left trigger should set robot.is_intaking"
    assert robot.intake.get_speed() == 0.85, (
        f"R.1: is_intaking is True, so the intake should run at 85% (0.85), got {robot.intake.get_speed()}")
    pad.set_axis("LeftTrigger", 0.0)
    teleop(runner, 0.2)
    assert not robot.is_intaking, "R.2: releasing the left trigger should set robot.is_intaking to False"
    assert robot.intake.get_speed() == 0, "R.1: with no flags set, the intake must stop"
- name: R.1 clear_jam wins
  code: |
    runner, robot, pad = start()
    teleop(runner, 0.5)
    pad.set_axis("LeftTrigger", 1.0)
    pad.set_pov(270)  # POV LEFT
    teleop(runner, 0.2)
    assert robot.intake.get_speed() == -0.30, (
        f"R.1: clear_jam is checked first, so the intake should run at -30% (-0.30), got {robot.intake.get_speed()}")
- name: R.3 auto intakes, then stops
  code: |
    runner, robot, pad = start()
    auto(runner, 1.0)
    assert robot.intake.get_speed() == 0.85, f"R.3: 1 s into auto the intake should run at 0.85, got {robot.intake.get_speed()}"
    auto(runner, 1.5)
    assert robot.intake.get_speed() == 0, f"R.3: after 2 s of auto the intake should stop, got {robot.intake.get_speed()}"
- name: R.3 auto works two times
  code: |
    runner, robot, pad = start()
    auto(runner, 2.5)
    runner.step_timing(seconds=0.5, autonomous=True, enabled=False)
    try:
        auto(runner, 1.0)
    except Exception as e:
        raise AssertionError(
            f"R.3: the second auto crashed: {type(e).__name__}. Make new commands inside make_auto() each time")
    assert robot.intake.get_speed() == 0.85, "R.3: the second auto should intake too"
- name: disabled stops everything
  code: |
    runner, robot, pad = start()
    teleop(runner, 0.5)
    pad.set_axis("LeftTrigger", 1.0)
    teleop(runner, 0.2)
    runner.step_timing(seconds=0.2, autonomous=False, enabled=False)
    assert robot.intake.get_speed() == 0, "when the robot is disabled, every subsystem must stop and stay stopped"
hints:
- 'R.1: the same if / elif / else as the hopper in exercise 3, with set_speed(JAM_SPEED) and set_speed(INTAKE_SPEED).'
- 'R.2: @self.driver1.LEFT_TRIGGER_AS_BUTTON.whenHeld and @self.driver1.LEFT_TRIGGER_AS_BUTTON.whenReleased'
- 'R.3: inside make_auto(): @commandify above def start_intake(): self.is_intaking = True, and the same for stop_intake.'
solution: |
  from commands2 import CommandScheduler, SequentialCommandGroup, WaitCommand
  from phoenix6 import controls, hardware
  from wpilib import SmartDashboard
  from wpilibextra.coroutine import commandify
  from wpilibextra.coroutine.coroutine_robot import CoroutineRobot
  from wpilibextra.coroutine.subsystem import Subsystem
  from wpilibextra.customcontroller import XboxCommandController

  ### const.py ###
  INTAKE_MOTOR_ID = 25
  INTAKE_SPEED = 85            # percent
  JAM_SPEED = -30              # percent
  AUTO_INTAKE_SECONDS = 2.0

  ### subsystems/intake.py ###
  class Intake(Subsystem):
      def __init__(self, robot):
          super().__init__()
          self.robot = robot
          self.commanded_speed = 0.0
          self.motor = hardware.TalonFX(INTAKE_MOTOR_ID, "rio")

      def set_speed(self, percent):
          self.commanded_speed = percent / 100
          self.motor.set_control(controls.DutyCycleOut(percent / 100))

      def get_speed(self):
          if self.robot.isSimulation():
              return self.commanded_speed
          return self.motor.get_velocity().value

      def stop(self):
          self.commanded_speed = 0.0
          self.motor.set_control(controls.DutyCycleOut(0.0))

      def periodic(self):
          if self.robot.clear_jam:
              self.set_speed(JAM_SPEED)
          elif self.robot.is_intaking:
              self.set_speed(INTAKE_SPEED)
          else:
              self.stop()

      def log(self):
          SmartDashboard.putNumber("Intake/Commanded Speed", self.commanded_speed)

  ### oi.py ###
  class OI:
      def __init__(self, robot):
          self.robot = robot
          self.driver1 = XboxCommandController(0)

          @self.driver1.POV.LEFT.whenHeld
          def _():
              self.robot.clear_jam = True

          @self.driver1.POV.LEFT.whenReleased
          def _():
              self.robot.clear_jam = False

          @self.driver1.LEFT_TRIGGER_AS_BUTTON.whenHeld
          def _():
              self.robot.is_intaking = True

          @self.driver1.LEFT_TRIGGER_AS_BUTTON.whenReleased
          def _():
              self.robot.is_intaking = False

  ### robot.py ###
  class Robot(CoroutineRobot):
      def robot_start(self):
          self.scheduler = CommandScheduler.getInstance()
          self.is_intaking = False
          self.clear_jam = False
          self.intake = Intake(self)
          self.subsystems = [self.intake]
          self.oi = OI(self)

          @self.addPeriodic(period=0.1, offset=0)
          def _():
              for subsystem in self.subsystems:
                  subsystem.log()

          while True:
              yield
              self.scheduler.run()

      def disabled_mode(self):
          self.scheduler.cancelAll()
          self.is_intaking = False
          self.clear_jam = False
          for subsystem in self.subsystems:
              subsystem.stop()
          while True:
              yield

      def autonomous_mode(self):
          self.scheduler.cancelAll()
          self.scheduler.schedule(self.make_auto())

      def make_auto(self):
          @commandify
          def start_intake():
              self.is_intaking = True

          @commandify
          def stop_intake():
              self.is_intaking = False

          return SequentialCommandGroup(
              start_intake,
              WaitCommand(AUTO_INTAKE_SECONDS),
              stop_intake,
          )

      def teleop_mode(self):
          self.scheduler.cancelAll()
          self.is_intaking = False
          self.clear_jam = False
          while True:
              yield
