title: Joystick math, a heading PID, and ChassisSpeeds
library: robotpy
prompt: |
  The drivetrain default command in `oi.py` turns the sticks into a field velocity. Then `drive_with_pid()` turns the robot to a heading with a `PIDController`, and `drive()` makes `ChassisSpeeds`.

  - **4.1** `square(x)`: `abs(x) * x`. It keeps the sign.
  - **4.2** `drive_translation(stick_x, stick_y, should_flip)`: a stick gives -1 when pushed forward or left. On the field, forward is +x and left is +y. So `forward_back = -square(stick_y)` and `left_right = -square(stick_x)`. On red, multiply both by -1. Return `Translation2d(forward_back, left_right) * SWERVE_MAX_SPEED`.
  - **4.3** `make_heading_pid()`: `PIDController(0.0275, 0.0, 0.0001)`, then `enableContinuousInput(0, 360)` and `setTolerance(2)`. From `drivetrain.py`.
  - **4.4** `field_to_robot_speeds(vx, vy, omega, heading_degrees)`: `ChassisSpeeds.fromFieldRelativeSpeeds(vx, vy, omega, rotation)`, where the rotation is a `Rotation2d`.
