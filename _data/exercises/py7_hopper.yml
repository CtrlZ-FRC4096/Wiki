title: Write a subsystem
library: robotpy
prompt: |
  This is a short copy of `subsystems/hopper.py` in Robot-2026. Finish it.

  - **1.1** `set_speed(speed)`: save `speed` in `self.commanded_speed`, then send the motor `controls.VelocityVoltage(speed)` with `set_control()`.
  - **1.2** `get_speed()`: in simulation the motor does not turn, so return the commanded speed. On the robot, return `self.indexer_motor.get_velocity().value`. `self.robot.isSimulation()` tells you which.
  - **1.3** `stop()`: set the commanded speed to 0 and send `controls.DutyCycleOut(0.0)`.
  - **1.4** `periodic()`: check the state flags of the robot in this order. The first `True` one wins: `self.robot.clear_jam` runs at `JAM_SPEED`, `self.robot.shoot_intent` runs at `FEED_SPEED`, anything else calls `stop()`.
  - **1.5** `log()`: put `"Hopper/Commanded Speed"` and `"Hopper/Actual Speed"` on the dashboard.

  Do not call `periodic()` yourself. The checks run the scheduler, and the scheduler calls it in every loop.
