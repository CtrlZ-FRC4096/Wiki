title: Write a subsystem
library: robotpy
prompt: |
  This is a short copy of `subsystems/hopper.py` in Robot-2026. The motor setup in `__init__` is complete. Write the other five methods.

  **What you have**

  - `self.robot` is the robot object. The OI sets True/False flags on it. In the checks, `self.robot` is a stand-in robot. Two of its flags matter here: `self.robot.clear_jam` and `self.robot.shoot_intent`. Both start as `False`.
  - `self.indexer_motor` is the TalonFX motor of the hopper.
  - `self.commanded_speed` holds the last speed that the code asked for.
  - `FEED_SPEED` and `JAM_SPEED` are at the top of the code, in rotations per second.

  **What you need**

  - `motor.set_control(request)` sends a request to a motor. `controls.VelocityVoltage(speed)` asks for a speed in rotations per second. `controls.DutyCycleOut(0.0)` asks for 0% output.
  - `motor.get_velocity().value` reads the speed of a real motor.
  - `self.robot.isSimulation()` is `True` in the browser and in the simulator, and `False` on the real robot.
  - `SmartDashboard.putNumber(key, value)` puts a number on the dashboard.

  **The parts**

  - **1.1** `set_speed(speed)`: remember the speed in `self.commanded_speed`, and send it to the motor as a `VelocityVoltage` request.
  - **1.2** `get_speed()`: a simulated motor does not turn, so its sensor always reads 0. In simulation, return the commanded speed. On the real robot, return the speed that the motor measures.
  - **1.3** `stop()`: set the commanded speed to 0, and send the motor 0% output.
  - **1.4** `periodic()`: decide what the hopper does from the flags. If `clear_jam` is `True`, run at `JAM_SPEED`. If `shoot_intent` is `True`, run at `FEED_SPEED`. If neither is `True`, stop. If both are `True`, `clear_jam` wins. Use the methods from 1.1 and 1.3.
  - **1.5** `log()`: put the commanded speed on the dashboard as `"Hopper/Commanded Speed"`, and the speed from `get_speed()` as `"Hopper/Actual Speed"`.

  This is the same shape in `periodic()` of `intake.py` in Robot-2026, shorter:

  ```python
  def periodic(self):
      if self.robot.intake_at_default:
          self.stop_intake()
      elif self.robot.clear_jam:
          self.set_intake_speed(-0.3 * 100)
      elif self.robot.is_intaking:
          self.set_intake_speed(0.85 * 100)
      else:
          self.stop_intake()
  ```

  Do not call `periodic()` yourself. The checks run the scheduler, and the scheduler calls `periodic()` one time in every loop.

